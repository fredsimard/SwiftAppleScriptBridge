name: Feature request
description: Suggest something the bridge should be able to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem rather than the solution — it often has a simpler answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: API sketch welcome.
      render: swift

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried?
      description: Workarounds you're using today, and why they fall short.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This belongs in a general-purpose AppleScript bridge, not in an app-specific layer on top of it.
          required: true
