included:
  - Sources
  - Tests

disabled_rules:
  # The codebase aligns switch cases and their bodies into columns for
  # readability, which these rules read as stray whitespace around colons
  # and as cases indented away from their closing brace.
  - colon
  - switch_case_alignment
  # Doc comments and AppleScript templates are deliberately not wrapped.
  - line_length
  # `executeAppleScript(_ AppleScript:)` keeps its original capitalized
  # parameter name for source compatibility.
  - identifier_name
  # Test files are one type per concern, not one per file.
  - type_name
  # The character-scanning loops chain `else if` on their own lines, one branch
  # per line, which reads better than trailing them onto the closing brace.
  - statement_position

opt_in_rules:
  - empty_count
  - force_unwrapping
  - redundant_nil_coalescing
  - unneeded_parentheses_in_closure_argument

force_unwrapping:
  severity: warning

cyclomatic_complexity:
  # parseSimpleAppleScriptRecord is a character scanner, and splitting its
  # branches across functions would make it harder to follow, not easier.
  warning: 20
  error: 25

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800
